<script type="module">

/* =========================

const subjectsContainer =

document.getElementById('level-title');

{title:'الإيقاظ العلمي',id:'science'}
],

'السنة الرابعة':[
{title:'الرياضيات',id:'math'},
{title:'اللغة العربية',id:'arabic'},
{title:'الفرنسية',id:'french'},
{title:'الإيقاظ العلمي',id:'science'}
],

'السنة الخامسة':[
{title:'الرياضيات',id:'math'},
{title:'اللغة العربية',id:'arabic'},
{title:'الفرنسية',id:'french'},
{title:'الإيقاظ العلمي',id:'science'}
],

'السنة السادسة':[
{title:'الرياضيات',id:'math'},
{title:'اللغة العربية',id:'arabic'},
{title:'الفرنسية',id:'french'},
{title:'الإيقاظ العلمي',id:'science'}
]

};

const levelMap = {

'السنة الثانية':'level2',
'السنة الثالثة':'level3',
'السنة الرابعة':'level4',
'السنة الخامسة':'level5',
'السنة السادسة':'level6'

};

/* =========================
CARD
========================= */

function createSection(title,color,folder){

let style = {
blue:{bg:'bg-blue-50',text:'text-blue-700',btn:'bg-blue-700'},
yellow:{bg:'bg-yellow-50',text:'text-yellow-700',btn:'bg-yellow-700'},
red:{bg:'bg-red-50',text:'text-red-700',btn:'bg-red-700'}
}[color];

return `
<div class="${style.bg} rounded-2xl p-4">

<div class="flex justify-between items-center">

<h3 class="font-black ${style.text} text-xl">
${title}
</h3>

<button class="upload-btn ${style.btn} text-white px-5 py-3 rounded-xl font-bold hidden">
رفع
</button>

</div>

<div class="files-box mt-4"></div>

</div>
`;

}

function createCard(subject,color){

return `

<div class="card bg-white rounded-[30px] p-6 shadow-xl">

<h2 class="text-5xl font-black ${color} mb-6">
${subject}
</h2>

<div class="space-y-4">

${createSection('الدروس','blue')}
${createSection('التمارين','yellow')}
${createSection('الاختبارات','red')}

</div>

</div>

`;

}

/* =========================
RENDER
========================= */

window.renderSubjects = function(level,btn=null){

levelTitle.innerText =
`✨ ${level} ✨`;

subjectsContainer.innerHTML = '';

document
.querySelectorAll('.level-btn')
.forEach(b=>{

b.classList.remove(
'bg-green-600',
'text-white'
);

b.classList.add(
'bg-white'
);

});

if(btn){

btn.classList.remove('bg-white');

btn.classList.add(
'bg-green-600',
'text-white'
);

}

const search =
searchInput.value.trim();

const subjects =
(subjectsByLevel[level] || [])
.filter(subject =>
subject.title.includes(search)
);

subjects.forEach(subject=>{

let color = 'text-blue-700';

if(subject.id === 'math'){
color = 'text-indigo-700';
}

if(subject.id === 'arabic'){
color = 'text-green-700';
}

if(subject.id === 'science'){
color = 'text-orange-700';
}

if(subject.id === 'french'){
color = 'text-pink-700';
}

subjectsContainer.innerHTML +=
createCard(
subject.title,
color
);

});

if(isAdmin){

document
.querySelectorAll('.upload-btn')
.forEach(btn=>{

btn.classList.remove('hidden');

});

}

}

/* =========================
ABOUT

window.openAboutPage = function(){

subjectsContainer.innerHTML = `

<div class="col-span-full">

let isAdmin = false;

window.openLogin = function(){

subjectsContainer.innerHTML = `

<div class="bg-white p-10 rounded-[35px] shadow-2xl w-full max-w-md">

id="email"

/>

id="password"

/>

<button

دخول
</button>

</div>

</div>

`;

}

/* LOGIN */

window.login = async function(){

isAdmin = true;

document
.getElementById('logout-btn')
.classList.remove('hidden');

document
.getElementById('bg-btn-container')
.classList.remove('hidden');

alert('تم تسجيل الدخول');

renderSubjects('السنة الأولى');

}

/* LOGOUT */

window.logout = async function(){

isAdmin = false;

document
.getElementById('logout-btn')
.classList.add('hidden');

document
.getElementById('bg-btn-container')
.classList.add('hidden');

alert('تم تسجيل الخروج');

renderSubjects('السنة الأولى');

}

/* =========================
SEARCH
========================= */

searchInput.addEventListener('input',()=>{

const level =
levelTitle.innerText
.replaceAll('✨','')
.trim();

renderSubjects(level);

});

/* =========================
BACKGROUND
========================= */

const changeBgBtn =
document.getElementById("changeBgBtn");

const bgInput =
document.getElementById("bgInput");

changeBgBtn?.addEventListener("click", ()=>{

    bgInput.click();

});

bgInput?.addEventListener("change",(e)=>{

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        const imageUrl =
        event.target.result;

        document.body.style.backgroundImage =
        `url('${imageUrl}')`;

        document.body.style.backgroundSize =
        "cover";

        document.body.style.backgroundPosition =
        "center";

        document.body.style.backgroundAttachment =
        "fixed";

        localStorage.setItem(
            "siteBackground",
            imageUrl
        );

    };

    reader.readAsDataURL(file);

});

window.addEventListener("load",()=>{

    const savedBg =
    localStorage.getItem("siteBackground");

    if(savedBg){

        document.body.style.backgroundImage =
        `url('${savedBg}')`;

        document.body.style.backgroundSize =
        "cover";

        document.body.style.backgroundPosition =
        "center";

        document.body.style.backgroundAttachment =
        "fixed";

    }

});

/* =========================
START
========================= */

renderSubjects('السنة الأولى');

</script>
